version: '3.8'

services:
  otp-service:
    build: .
    container_name: saudelink-otp-service
    restart: always
    environment:
      - PORT=4012
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-"SaúdeLink" <no-reply@saudelink.ao>}
    ports:
      - "4012:4012"
    labels:
      - "traefik.enable=true"
      # Traefik Router configuration
      - "traefik.http.routers.saudelink-otp.rule=Host(`otp.saudelink.ao`) || Host(`207.180.238.15`)"
      - "traefik.http.routers.saudelink-otp.entrypoints=web,websecure"
      - "traefik.http.services.saudelink-otp.loadbalancer.server.port=4012"
    networks:
      - default

networks:
  default:
    name: saudelink-otp-net
